services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: dul-ui-gijun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dul_ui_gijun}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - dul-ui-gijun-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dul_ui_gijun}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dul-ui-gijun-postgres-data:
